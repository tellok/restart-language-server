name: Public repository runner routing verification
on:
  push:
    branches: [codex/hosted-runner-validation-20261106]
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$RUNNER_ENVIRONMENT" = github-hosted
  opt-in:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - run: |
          test "$RUNNER_ENVIRONMENT" = self-hosted
          case "$RUNNER_NAME" in github-runner-job-*) ;; *) exit 1 ;; esac
          uname -m
